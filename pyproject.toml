[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-oauth-guard"
version = "1.0.0"
description = "Zero-dependency MCP OAuth 2.1 config auditor, metadata probe, and concurrency race simulator."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mcp-oauth-guard = "mcp_oauth_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
